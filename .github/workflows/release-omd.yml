name: release-omd

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_gitee:
        description: Publish the same assets to Gitee when GITEE_TOKEN is configured
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ARCHIVE: omd-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release versions
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          with (root / "crates/omd/Cargo.toml").open("rb") as handle:
              cargo_version = tomllib.load(handle)["package"]["version"]
          npm_version = json.loads(
              (root / "npm/package.json").read_text()
          )["version"]

          versions = {
              "VERSION": version,
              "crates/omd/Cargo.toml": cargo_version,
              "npm/package.json": npm_version,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"release versions do not match: {versions}")

          if os.environ["RELEASE_REF_TYPE"] == "tag":
              expected = f"v{version}"
              actual = os.environ["RELEASE_REF_NAME"]
              if actual != expected:
                  raise SystemExit(
                      f"release tag {actual} does not match VERSION {version}"
                  )
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build omd
        run: cargo build --release -p omd

      - name: Package omd
        run: |
          set -euo pipefail
          # build/package-omd.sh performs: tar -czf ... and sha256sum ...
          bash build/package-omd.sh \
            target/release/omd \
            dist \
            x86_64-unknown-linux-gnu

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omd-x86_64-unknown-linux-gnu
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Package npm distribution
        run: bash build/package-npm.sh "dist/${ARCHIVE}" dist/npm

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-devpod-npm
          path: dist/npm/oh-my-devpod-*.tgz

      # Optional Gitee surface:
      # - configure repository secret GITEE_TOKEN with release permissions;
      # - run workflow_dispatch with publish_gitee=true, or publish a tag;
      # - GITEE_OWNER/GITEE_REPO may be changed below for a differently named mirror.
      # GitHub release publishing does not depend on any Gitee secret.
      - name: Publish matching Gitee release assets
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_gitee)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: zhangdw156
          GITEE_REPO: oh-my-devpod
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "GITEE_TOKEN is not configured; skipping optional Gitee publish."
            exit 0
          fi

          api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          release_json="$(
            curl -fsS "${api}/releases/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}"
          )"
          release_id="$(
            python3 -c '
          import json, sys
          value = json.load(sys.stdin)
          print(value.get("id", "") if isinstance(value, dict) else "")
          ' <<<"${release_json}"
          )"
          if [[ -z "${release_id}" ]]; then
            release_json="$(
              curl -fsS -X POST "${api}/releases" \
                -d "access_token=${GITEE_TOKEN}" \
                -d "tag_name=${RELEASE_TAG}" \
                -d "name=${RELEASE_TAG}" \
                -d "target_commitish=${GITHUB_SHA}" \
                --data-urlencode "body=Release synchronized from GitHub."
            )"
            release_id="$(
              python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' \
                <<<"${release_json}"
            )"
          fi

          for asset in "dist/${ARCHIVE}" "dist/${ARCHIVE}.sha256"; do
            curl -fsS -X POST \
              "${api}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${asset}"
          done

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: oh-my-devpod-npm
          path: dist/npm

      - name: Publish npm package
        run: |
          set -euo pipefail
          package="$(find dist/npm -maxdepth 1 -name 'oh-my-devpod-*.tgz' -print -quit)"
          [[ -n "${package}" ]] || {
            echo "npm package artifact is missing" >&2
            exit 1
          }
          filename="$(basename "${package}")"
          version="${filename#oh-my-devpod-}"
          version="${version%.tgz}"
          npm_tag="latest"
          [[ "${version}" != *-* ]] || npm_tag="next"
          npm publish "${package}" \
            --access public \
            --provenance \
            --tag "${npm_tag}"
