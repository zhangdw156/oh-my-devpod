name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm used by package tests
        run: npm install --global npm@11.5.1
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          cd "${RUNNER_TEMP}"
          apt-get download ripgrep
          mkdir -p "${RUNNER_TEMP}/ripgrep"
          dpkg-deb -x ripgrep_*.deb "${RUNNER_TEMP}/ripgrep"
          echo "${RUNNER_TEMP}/ripgrep/usr/bin" >> "${GITHUB_PATH}"
      - name: Run regression suite
        run: bash tests/run.sh
      - name: Smoke test npm package with the release binary
        run: |
          set -euo pipefail
          npm_root="${RUNNER_TEMP}/npm-smoke"
          npm_home="${RUNNER_TEMP}/npm-home"
          cargo build --release -p omd
          bash build/package-omd.sh \
            target/release/omd \
            "${RUNNER_TEMP}/release" \
            x86_64-unknown-linux-gnu
          package="$(
            bash build/package-npm.sh \
              "${RUNNER_TEMP}/release/omd-x86_64-unknown-linux-gnu.tar.gz" \
              "${RUNNER_TEMP}/npm-dist"
          )"
          HOME="${npm_home}" XDG_CONFIG_HOME="${npm_home}/.config" \
            OHMYDEVPOD_SOURCE=gitee \
            npm install --global --prefix "${npm_root}" "${package}"
          test "$(cat "${npm_root}/lib/node_modules/oh-my-devpod/.npm-source")" = gitee
          test "$(cat "${npm_home}/.config/oh-my-devpod/npm-source")" = gitee
          HOME="${npm_home}" "${npm_root}/bin/omd" --version
          HOME="${npm_home}" "${npm_root}/bin/omd" --list-components
          if HOME="${npm_home}" "${npm_root}/bin/omd" --update \
            >"${RUNNER_TEMP}/npm-update.out" 2>&1; then
            echo "npm-managed omd --update should fail" >&2
            exit 1
          fi
          grep -Fq 'npm update -g oh-my-devpod' "${RUNNER_TEMP}/npm-update.out"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p omd --all-targets -- -D warnings
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          micromamba-version: 2.9.0-0
          init-shell: none
          micromamba-root-path: ${{ runner.temp }}/setup-mamba-root
          micromamba-binary-path: ${{ runner.temp }}/micromamba-bin/micromamba
          post-cleanup: none
      - name: Verify Mamba hook activation
        env:
          OMD_TEST_REAL_MAMBA_BIN: ${{ runner.temp }}/micromamba-bin/micromamba
        run: bash tests/test-shell-activation.sh
